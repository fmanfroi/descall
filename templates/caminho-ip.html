<!DOCTYPE html>
<html>
<head>
    <title>Rastreio de Rede</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .info { color: #555; margin-bottom: 10px; }
        .tag { background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; font-family: monospace;}
    </style>
</head>
<body>
    <div class="box">
        <h2>🔎 Análise de Rede em Curso...</h2>
        
        <p class="info"><strong>Caminho Público (Visto pelo Servidor):</strong> 
            <span class="tag">{{ caminho_visual }}</span>
        </p>
        
        <p class="info"><strong>IP Local (Detetado via JS):</strong> 
            <span id="local-ip" class="tag">A detetar...</span>
        </p>
        
        <p id="status" style="margin-top: 20px; font-weight: bold;">A enviar dados...</p>
    </div>

    <script>
        // O Jinja2 injeta a lista formatada aqui
        const ipsPublicos = {{ lista_js | safe }}; 
        let ipLocalEncontrado = "Não detetado (Bloqueio de Browser)";

        // --- TÉCNICA WEBRTC PARA LER IP LOCAL ---
        const peerConnection = new RTCPeerConnection({iceServers: []});
        peerConnection.createDataChannel('');
        
        peerConnection.createOffer().then(offer => peerConnection.setLocalDescription(offer));

        peerConnection.onicecandidate = (event) => {
            if (!event || !event.candidate || !event.candidate.candidate) return;
            
            const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
            const match = ipRegex.exec(event.candidate.candidate);
            
            if (match) {
                ipLocalEncontrado = match[1];
                document.getElementById('local-ip').innerText = ipLocalEncontrado;
                
                enviarDados();
                peerConnection.onicecandidate = null;
                peerConnection.close();
            }
        };

        function enviarDados() {
            fetch('/coletar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    caminho_publico: ipsPublicos,
                    ip_local_js: ipLocalEncontrado
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('status').innerText = "✅ Dados enviados com sucesso!";
                document.getElementById('status').style.color = "green";
                console.log("Resposta do servidor:", data);
            })
            .catch(err => {
                document.getElementById('status').innerText = "❌ Erro ao enviar.";
                document.getElementById('status').style.color = "red";
                console.error(err);
            });
        }

        setTimeout(() => {
            if(document.getElementById('status').innerText.includes("enviar")) {
                enviarDados();
            }
        }, 2000);
    </script>
</body>
</html>
