<!DOCTYPE html>
<html>
<head>
    <title>Rastreio de Rede Avançado</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .info { color: #555; margin-bottom: 10px; }
        .tag { background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; font-family: monospace;}
        .warning { color: #d97706; font-size: 0.9em; margin-top: 5px;}
    </style>
</head>
<body>
    <div class="box">
        <h2>🔎 Diagnóstico de Rede</h2>
        
        <p class="info"><strong>Caminho Público (Servidor):</strong> 
            <span class="tag">{{ caminho_visual }}</span>
        </p>
        
        <p class="info"><strong>IP Local (Navegador):</strong> 
            <span id="local-ip" class="tag">A aguardar WebRTC...</span>
        </p>
        <p id="obs" class="warning"></p>
        
        <p id="status" style="margin-top: 20px; font-weight: bold;">A processar...</p>
    </div>

    <script>
        const ipsPublicos = {{ lista_js | safe }}; 
        let ipCapturado = "Falha na deteção";

        console.log("--> Iniciando tentativa de WebRTC...");

        // Configuração para tentar forçar a geração de candidatos
        const peerConnection = new RTCPeerConnection({
            iceServers: [{urls: "stun:stun.l.google.com:19302"}] 
        });

        // Cria um canal de dados "falso" para ativar o processo
        peerConnection.createDataChannel('');
        
        peerConnection.createOffer()
            .then(offer => peerConnection.setLocalDescription(offer))
            .catch(err => console.error("Erro no WebRTC:", err));

        peerConnection.onicecandidate = (event) => {
            if (!event || !event.candidate || !event.candidate.candidate) {
                console.log("--> Fim dos candidatos.");
                return;
            }

            const candidato = event.candidate.candidate;
            console.log("--> Candidato encontrado:", candidato);

            // Regex atualizada para capturar IPs IPv4 típicos
            const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
            const match = ipRegex.exec(candidato);
            
            // Verificação se é um ID mDNS (proteção de privacidade)
            if (candidato.includes(".local")) {
                document.getElementById('obs').innerText = "Atenção: O teu navegador ocultou o IP real (mDNS detetado).";
                // Mesmo sendo oculto, vamos capturar a string para enviar
                // O formato costuma ser algo como: "xxxx-xxxx.local"
                const mdnsMatch = /[a-f0-9-]+\.local/.exec(candidato);
                if (mdnsMatch) {
                    ipCapturado = "Mascarado: " + mdnsMatch[0];
                    atualizarTela(ipCapturado);
                    enviarDados();
                    peerConnection.onicecandidate = null; 
                }
            }
            else if (match) {
                // Se achou um IP numérico real
                // Ignorar se for o IP público que o STUN retornou, queremos o local
                if (!ipsPublicos.includes(match[1])) {
                     ipCapturado = match[1];
                     atualizarTela(ipCapturado);
                     enviarDados();
                     peerConnection.onicecandidate = null; // Para de procurar
                }
            }
        };

        function atualizarTela(valor) {
            document.getElementById('local-ip').innerText = valor;
        }

        function enviarDados() {
            // Evita envios duplicados se já tiver enviado
            if (document.getElementById('status').innerText.includes("Sucesso")) return;

            fetch('/coletar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    caminho_publico: ipsPublicos,
                    ip_local_js: ipCapturado
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('status').innerText = "✅ Dados enviados (Sucesso)";
                document.getElementById('status').style.color = "green";
                console.log("Servidor respondeu:", data);
            });
        }

        // Timeout: Se em 3 segundos não achar nada, envia o erro
        setTimeout(() => {
            if(!document.getElementById('status').innerText.includes("Sucesso")) {
                enviarDados(); // Envia "Falha na deteção" ou o que tiver
                document.getElementById('status').innerText = "⚠️ Tempo esgotado (enviado o possível)";
            }
        }, 3000);
    </script>
</body>
</html>
